# Keepsake 发布流水线：打 tag → 自动构建 win 安装包 → 生成 SHA256SUMS → 挂到 GitHub Release（草稿）
# 发布前人工步骤（签名闸门③）：
#   1. 本地算安装包 sha256：certutil -hashfile app/dist/Keepsake-Setup-x.y.z.exe SHA256
#   2. 签清单：node tools/sign_update.js x.y.z <Release资产下载URL> <sha256> > update.json
#   3. 把 update.json 传到更新源（GitHub Pages / gist / 自有服务器）
name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  build-win:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        working-directory: app
        run: npm install

      - name: Build installer
        working-directory: app
        run: npx electron-builder --win nsis
        env:
          # 无代码签名证书时跳过签名（公测期）
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'

      # 构建产物在 app/dist（package.json 位于 app/ 子目录），后续步骤统一用 app/dist 路径
      - name: Generate SHA256SUMS
        working-directory: app
        shell: pwsh
        run: |
          $files = Get-ChildItem dist -Recurse -Include *.exe,*.zip -File
          $lines = foreach ($f in $files) {
            $h = (Get-FileHash $f.FullName -Algorithm SHA256).Hash.ToLower()
            "$h  $($f.Name)"
          }
          $lines | Out-File -Encoding ascii dist/SHA256SUMS.txt
          Get-Content dist/SHA256SUMS.txt

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: |
            app/dist/*.exe
            app/dist/SHA256SUMS.txt

      - name: Attach to draft release
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          files: |
            app/dist/*.exe
            app/dist/SHA256SUMS.txt
