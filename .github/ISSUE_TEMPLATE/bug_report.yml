name: 问题反馈
description: 订阅、下载、转写或界面出问题，填这一份
title: "[问题] "
body:
  - type: markdown
    attributes:
      value: |
        提交前请先读一遍 README 的「常见问题」。

        请不要粘贴真实 Cookie、token、账号密码或带登录态的链接，截图记得打码。

  - type: input
    id: version
    attributes:
      label: Keepsake 版本
      description: 设置页或 About 里能看到
      placeholder: 例如 0.3.0
    validations:
      required: true

  - type: input
    id: windows
    attributes:
      label: Windows 版本
      placeholder: 例如 Windows 11 23H2
    validations:
      required: true

  - type: dropdown
    id: area
    attributes:
      label: 出问题的环节
      options:
        - 订阅检查
        - 下载队列
        - 媒体库
        - 本地转写
        - 首次运行的组件下载
        - 界面显示
        - 其他
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: 复现步骤
      description: 贴的哪类链接、点了什么、等到哪一步
      placeholder: |
        1.
        2.
        3.
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: 期望发生什么 / 实际发生什么
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: 截图或日志（可选）
      description: 请先删掉其中的 Cookie、用户名、个人主页名
      render: shell

  - type: checkboxes
    id: confirm
    attributes:
      label: 提交前确认
      options:
        - label: 我已删掉截图和文本里的凭据与个人信息
          required: true
        - label: 我确认要保存的内容自己有权保存
          required: true
